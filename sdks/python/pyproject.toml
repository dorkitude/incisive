[project]
name = "incisive"
version = "0.1.0"
description = "Python client for the incisive analytics server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.25,<3",
    "cryptography>=42",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incisive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
