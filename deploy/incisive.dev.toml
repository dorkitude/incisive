# Dev deployment on the incisive VM, behind host Caddy on :8000 (see Caddyfile).
# Credentials are not stored here: object storage uses the named AWS profile.

[server]
tracker_url = "https://static.tryincisive.com/js/incisive.js"
addr = "127.0.0.1:8080"
public_url = "https://dev.tryincisive.com"
trust_forwarded_for = true
secure_cookies = true

[storage]
backend = "s3"
bucket = "incisive-internal"
endpoint = "https://af598f7ed46feb6858634f62aec92c56.r2.cloudflarestorage.com"
region = "auto"
profile = "r2-internal"
prefix = "dev/"

[cache]
dir = "/var/lib/incisive/cache"
max_disk_bytes = 20_000_000_000

[meta]
path = "/var/lib/incisive/meta.sqlite"
backup_interval_secs = 300

[email]
# The exe.dev integration adds the Resend credential; no key on the VM.
resend_url = "https://resend-incisive-dev.int.exe.xyz"
from = "Incisive <login@dev.tryincisive.com>"
log_only = false

[geo]
# DB-IP City Lite, refreshed monthly by deploy/incisive-geo.timer.
db_path = "/var/lib/incisive/geo/dbip-city-lite.mmdb"
