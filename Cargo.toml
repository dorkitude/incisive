[package]
name = "incisive"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
cbc = { version = "0.2.1", features = ["alloc"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
futures = "0.3.34"
hex = "0.4.3"
lru = "0.19.0"
maud = "0.27.0"
maxminddb = "0.32.0"
object_store = { version = "0.14.2", features = ["aws"] }
once_cell = "1.21.4"
parking_lot = "0.13.0"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "zstd", "async"] }
percent-encoding = "2.3.2"
prometheus = "0.14.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
ulid = "3.0.0"
url = "2.5.8"
woothee = "0.13.0"
zstd = "0.14.3"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
